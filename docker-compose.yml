services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zavu_mvp
    ports:
      - "5433:5432"
    volumes:
      - zavu_mvp_pgdata:/var/lib/postgresql/data

volumes:
  zavu_mvp_pgdata:
